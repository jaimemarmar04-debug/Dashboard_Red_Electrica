services:
  - type: web
    name: cuando-enchufar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Un solo worker: el planificador de ingesta corre dentro del proceso
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOW_SYNTHETIC_FALLBACK
        value: "1"
